<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <!-- Radial gradient background -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#181430" />
            <stop offset="100%" stop-color="#080610" />
        </radialGradient>
        <!-- Linear gradient for logo paths -->
        <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#7B61FF" />
        </linearGradient>
    </defs>
    <!-- Circular gradient background for perfect visibility on all browser themes -->
    <circle cx="50" cy="50" r="46" fill="url(#bg-grad)" stroke="rgba(123,97,255,0.22)" stroke-width="2"/>
    <!-- Scale and translate the path to fit inside the circle -->
    <g transform="translate(16, 16) scale(0.68)">
        <path d="M 5,95 L 50,5 L 95,95 L 50,95 M 50,5 L 50,95 M 27.5,50 L 27.5,95 L 5,95 M 27.5,50 L 50,95" 
              stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
</svg>
