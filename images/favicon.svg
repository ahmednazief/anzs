<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#7B61FF" />
        </linearGradient>
    </defs>
    <!-- Dark rounded background for perfect visibility on all browser tab themes -->
    <rect x="2" y="2" width="96" height="96" rx="24" fill="#060810" stroke="rgba(123,97,255,0.25)" stroke-width="3"/>
    <!-- Scale and translate the path to fit inside the rounded rect -->
    <g transform="translate(10, 10) scale(0.8)">
        <path d="M 5,95 L 50,5 L 95,95 L 50,95 M 50,5 L 50,95 M 27.5,50 L 27.5,95 L 5,95 M 27.5,50 L 50,95" 
              stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
</svg>
