    <style>
        body {
            background-color: #060810 !important;
            color: #F4F4F8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        .maintenance-container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            padding: 4rem 3rem;
            text-align: center;
            background: rgba(12, 11, 21, 0.45);
            border: 1px solid rgba(123, 97, 255, 0.18);
            border-radius: var(--r-xl);
            box-shadow: 
                0 40px 120px rgba(0,0,0,0.85),
                0 0 80px rgba(123, 97, 255, 0.05),
                inset 0 1px 0 rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin: 1.5rem;
        }
        .maintenance-glow-purple {
            position: absolute;
            top: 25%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(123, 97, 255, 0.08) 0%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }
        .maintenance-glow-gold {
            position: absolute;
            bottom: 25%; left: 50%;
            transform: translate(-50%, 50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }
        .maintenance-icon-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(123, 97, 255, 0.08);
            border: 1px solid rgba(123, 97, 255, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(123, 97, 255, 0.08);
        }
        .maintenance-icon-wrap i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #7B61FF, #00F5FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseIcon 2.5s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 10px #7B61FF); }
        }
        .maintenance-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 1.1rem;
            border-radius: var(--r-pill);
            background: rgba(123, 97, 255, 0.08);
            border: 1px solid rgba(123, 97, 255, 0.25);
            color: #7B61FF;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-family: var(--f-mono);
            margin-bottom: 1.5rem;
        }
        .maintenance-badge span.pulse-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #7B61FF;
            box-shadow: 0 0 0 0 rgba(123, 97, 255, 0.4);
            animation: badgePulse 2s infinite;
        }
        @keyframes badgePulse {
            0% { box-shadow: 0 0 0 0 rgba(123, 97, 255, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(123, 97, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(123, 97, 255, 0); }
        }
        .maintenance-title {
            font-family: var(--f-display);
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 40%, #7B61FF 70%, #00F5FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .maintenance-desc {
            color: var(--c-muted);
            font-size: 1.05rem;
            line-height: 1.65;
            margin-bottom: 2rem;
        }
        .maintenance-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: var(--r-pill);
            overflow: hidden;
            margin-bottom: 2.5rem;
        }
        .maintenance-progress-bar {
            height: 100%;
            width: 85%;
            background: linear-gradient(90deg, #7B61FF, #D4AF37);
            border-radius: var(--r-pill);
            animation: loadBar 3s ease-out forwards;
        }
        @keyframes loadBar {
            0% { width: 0%; }
            100% { width: 85%; }
        }
        .maintenance-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.5rem;
        }
        .m-link {
            color: var(--c-subtle);
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .m-link:hover {
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="free-page">

<canvas id="particleCanvas"></canvas>

<div class="maintenance-glow-purple"></div>
<div class="maintenance-glow-gold"></div>

<div class="maintenance-container">
    <div class="maintenance-icon-wrap">
        <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>
    <div class="maintenance-badge">
        <span class="pulse-dot"></span>
        <span>Major Update Ongoing</span>
    </div>
    <h1 class="maintenance-title">MAJOR UPDATE ONGOING</h1>
    <p class="maintenance-desc">
        We are currently deploying a major system update to Cuttify. Expect 10&times; faster automation, advanced speech processing, and a completely refreshed user experience. We'll be back online shortly.
    </p>
    <div class="maintenance-progress" title="Upgrade 85% complete">
        <div class="maintenance-progress-bar"></div>
    </div>
    <div class="maintenance-footer">
        <a href="index.html" class="m-link"><i class="fa-solid fa-house"></i> Portfolio</a>
        <a href="mailto:ahmednazief@gmail.com" class="m-link"><i class="fa-solid fa-envelope"></i> Support</a>
        <a href="https://www.youtube.com/@Plains" target="_blank" class="m-link"><i class="fa-brands fa-youtube"></i> YouTube</a>
    </div>
</div>

<script src="cuttify.js?v=7.2"></script>
</body>
</html>
