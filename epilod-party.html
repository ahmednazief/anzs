  <style>
    :root {
      --canvas: #060608;
      --ink-primary: #f4f4f6;
      --ink-secondary: #a1a1aa;
      --ink-muted: #71717a;

      --amethyst: #7c3aed;
      --amethyst-bright: #8b5cf6;
      --amethyst-soft: #c4b5fd;
      --amethyst-ice: #ddd6fe;
      --amethyst-mist: #ede9fe;

      --spring-fluid: cubic-bezier(0.22, 1.24, 0.36, 1);
      --spring-soft: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-glass: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--canvas);
      color: var(--ink-primary);
      font-family: "Inter", "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--canvas);
      color: var(--ink-primary);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }

    .num {
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }

    /* =====================================================================
       Luminous Cinema Light Field (gives Liquid Glass real light to refract)
       ===================================================================== */
    .cinema-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .aurora-bloom {
      position: absolute;
      left: 50%;
      top: 120px;
      width: min(980px, 110vw);
      height: min(620px, 75vw);
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          48% 46% at 44% 38%,
          rgba(139, 92, 246, 0.24) 0%,
          rgba(124, 58, 237, 0.11) 46%,
          rgba(124, 58, 237, 0) 76%
        ),
        radial-gradient(
          42% 40% at 62% 52%,
          rgba(221, 214, 254, 0.08) 0%,
          rgba(167, 139, 250, 0.03) 48%,
          rgba(167, 139, 250, 0) 76%
        );
      filter: blur(56px);
      animation: auroraBreathe 12s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .stage-horizon {
      position: absolute;
      left: 50%;
      top: 340px;
      width: min(1240px, 120vw);
      height: 520px;
      transform: translateX(-50%);
      background: radial-gradient(
        60% 55% at 50% 45%,
        rgba(109, 40, 217, 0.16) 0%,
        rgba(76, 29, 149, 0.06) 48%,
        rgba(6, 6, 8, 0) 76%
      );
      filter: blur(64px);
    }

    @keyframes auroraBreathe {
      0% {
        transform: translate3d(-50%, 0, 0) scale(1);
        opacity: 0.84;
      }
      100% {
        transform: translate3d(-50%, -10px, 0) scale(1.045);
        opacity: 1;
      }
    }

    /* =====================================================================
       Optical Condensation Reveal Choreography
       ===================================================================== */
    .liquid-reveal {
      opacity: 0;
      transform: translateY(14px) scale(0.972);
      filter: blur(10px);
      animation: liquidCondense 720ms var(--spring-soft) forwards;
      animation-delay: var(--delay, 0ms);
    }

    .liquid-reveal-stage {
      opacity: 0;
      transform: translateY(22px) scale(0.966);
      filter: blur(14px);
      animation: liquidCondenseStage 860ms var(--spring-soft) forwards;
      animation-delay: var(--delay, 220ms);
    }

    @keyframes liquidCondense {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.972);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @keyframes liquidCondenseStage {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.966);
        filter: blur(14px);
      }
      100% {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    /* =====================================================================
       Minimal Floating Header
       ===================================================================== */
    .top-bar {
      --delay: 0ms;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px clamp(18px, 4vw, 32px) 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.94rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 4px 12px rgba(124, 58, 237, 0.36));
    }

    .top-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-secondary);
      padding: 6px 12px;
      border-radius: 9999px;
      transition:
        color 160ms var(--ease-glass),
        background-color 160ms var(--ease-glass);
    }

    .top-link:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.06);
    }

    /* =====================================================================
       Main Stage
       ===================================================================== */
    .page-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: clamp(24px, 4.2vh, 46px) clamp(18px, 4vw, 32px) 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .hero-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-title {
      --delay: 55ms;
      font-size: clamp(2.25rem, 4.8vw, 3.45rem);
      font-weight: 650;
      letter-spacing: -0.042em;
      line-height: 1.04;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #f4f4f6 62%,
        rgba(221, 214, 254, 0.86) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      --delay: 110ms;
      margin-top: 12px;
      max-width: 580px;
      font-size: clamp(0.95rem, 1.55vw, 1.06rem);
      font-weight: 420;
      line-height: 1.5;
      letter-spacing: -0.012em;
      color: var(--ink-secondary);
    }

    /* =====================================================================
       Big iOS 27 Liquid Glass Download Button
       (Concentric Specular Corner Bezel + Crystal Icon Badge + Caustic Glow)
       ===================================================================== */
    .cta-block {
      --delay: 165ms;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ep-liquid-download {
      --mx: 50%;
      --my: 50%;
      --rim-angle: 132deg;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 54px;
      padding: 0 26px 0 9px;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 570;
      letter-spacing: -0.015em;
      cursor: pointer;
      user-select: none;
      background-color: rgba(109, 40, 217, 0.28);
      background-image:
        radial-gradient(
          165px circle at var(--mx) var(--my),
          rgba(237, 233, 254, 0.24) 0%,
          rgba(167, 139, 250, 0.12) 44%,
          rgba(167, 139, 250, 0) 74%
        ),
        linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(139, 92, 246, 0.22) 48%,
          rgba(91, 33, 182, 0.34) 100%
        );
      -webkit-backdrop-filter: blur(28px) saturate(185%) brightness(1.06);
      backdrop-filter: blur(28px) saturate(185%) brightness(1.06);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 0 rgba(196, 181, 253, 0.16),
        0 18px 44px -10px rgba(124, 58, 237, 0.52),
        0 6px 20px -4px rgba(0, 0, 0, 0.76);
      transition:
        transform 260ms var(--spring-fluid),
        background-color 180ms var(--ease-glass),
        box-shadow 240ms var(--ease-glass);
    }

    /* Concentric iOS 27 specular rim light (brightest at diagonal bevels, fades on sides) */
    .ep-liquid-download::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1.25px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(
        var(--rim-angle),
        rgba(255, 255, 255, 0.78) 0%,
        rgba(221, 214, 254, 0.22) 28%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(196, 181, 253, 0.20) 74%,
        rgba(237, 233, 254, 0.58) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.88;
      transition: opacity 200ms var(--ease-glass);
    }

    /* Subtle internal violet refraction puddle along lower curve */
    .ep-liquid-download::after {
      content: "";
      position: absolute;
      inset: auto 18px 2px 18px;
      height: 34%;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        75% 100% at 50% 100%,
        rgba(167, 139, 250, 0.24) 0%,
        rgba(124, 58, 237, 0) 100%
      );
      opacity: 0.7;
      transition: opacity 200ms var(--ease-glass);
    }

    /* One-shot diagonal glass sheen on initial settle */
    .btn-sheen {
      position: absolute;
      top: -24%;
      left: -45%;
      width: 32%;
      height: 148%;
      pointer-events: none;
      z-index: 1;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.26) 48%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg) translateX(0);
      opacity: 0;
      animation: glassSweep 1150ms var(--ease-glass) 780ms 1 forwards;
    }

    @keyframes glassSweep {
      0% {
        transform: skewX(-20deg) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.72;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        transform: skewX(-20deg) translateX(480%);
        opacity: 0;
      }
    }

    .ep-liquid-download > *:not(.btn-sheen):not(.liquid-ripple) {
      position: relative;
      z-index: 3;
    }

    .ep-liquid-download:hover {
      transform: translateY(-2px) scale(1.022);
      background-color: rgba(124, 58, 237, 0.40);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.30),
        inset 0 -1px 0 0 rgba(221, 214, 254, 0.24),
        0 22px 52px -10px rgba(124, 58, 237, 0.64),
        0 8px 24px -4px rgba(0, 0, 0, 0.80);
    }

    .ep-liquid-download:hover::before {
      opacity: 1;
    }

    .ep-liquid-download:hover::after {
      opacity: 0.96;
    }

    .ep-liquid-download:active,
    .ep-liquid-download.is-pressing {
      transform: scale(0.96);
      transition-duration: 75ms;
      transition-timing-function: ease-out;
    }

    .ep-liquid-download:focus-visible {
      outline: 2px solid rgba(221, 214, 254, 0.78);
      outline-offset: 4px;
    }

    /* Left Amethyst Crystal Squircle inside the Download capsule (matches Watch Party pill) */
    .dl-orb-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      flex-shrink: 0;
      background: linear-gradient(155deg, rgba(167, 139, 250, 0.55) 0%, rgba(109, 40, 217, 0.78) 100%);
      border: 1px solid rgba(237, 233, 254, 0.42);
      box-shadow:
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0.5px 0 rgba(196, 181, 253, 0.24),
        0 4px 14px -2px rgba(124, 58, 237, 0.52);
      transition: transform 260ms var(--spring-fluid), box-shadow 220ms var(--ease-glass);
    }

    .ep-liquid-download:hover .dl-orb-badge {
      transform: scale(1.05);
      box-shadow:
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.72),
        inset 0 -1px 0.5px 0 rgba(221, 214, 254, 0.32),
        0 6px 18px -2px rgba(139, 92, 246, 0.68);
    }

    .dl-arrow-stem {
      transition: transform 260ms var(--spring-fluid);
      transform-origin: center;
    }

    .ep-liquid-download:hover .dl-arrow-stem {
      transform: translateY(2px);
    }

    .ep-liquid-download:active .dl-arrow-stem {
      transform: translateY(3px) scaleY(0.92);
    }

    .dl-label {
      white-space: nowrap;
      text-shadow: 0 1px 8px rgba(6, 4, 16, 0.55);
    }

    .liquid-ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(221, 214, 254, 0.22) 42%,
        rgba(139, 92, 246, 0) 74%
      );
      transform: translate(-50%, -50%) scale(0);
      animation: liquidRippleOut 680ms var(--ease-glass) forwards;
    }

    @keyframes liquidRippleOut {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }

    /* Quiet single-line metadata beneath CTA */
    .cta-meta {
      --delay: 205ms;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 0.8125rem;
      font-weight: 450;
      color: var(--ink-secondary);
      letter-spacing: -0.005em;
    }

    .meta-os {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-primary);
      font-weight: 500;
    }

    .meta-dot {
      color: var(--ink-muted);
      user-select: none;
    }

    .beta-indicator {
      color: var(--amethyst-ice);
      font-weight: 500;
    }

    /* =====================================================================
       Big App Screenshot Showcase (fits cleanly uncut on desktop hero)
       ===================================================================== */
    .showcase-stage {
      --delay: 230ms;
      position: relative;
      width: 100%;
      max-width: min(1040px, calc(60dvh * 1.6585));
      min-width: min(100%, 300px);
      aspect-ratio: 2720 / 1640;
      margin-top: clamp(20px, 3vh, 30px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .showcase-halo {
      position: absolute;
      inset: 4% 6% -6% 6%;
      border-radius: 40px;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(65% 60% at 50% 42%, rgba(124, 58, 237, 0.22) 0%, rgba(124, 58, 237, 0.06) 55%, transparent 78%),
        radial-gradient(50% 40% at 25% 75%, rgba(167, 139, 250, 0.12) 0%, transparent 72%);
      filter: blur(48px);
    }

    .screenshot-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      cursor: zoom-in;
      transition: transform 420ms var(--spring-soft);
    }

    .screenshot-frame:hover {
      transform: translateY(-2px);
    }

    .screenshot-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 32px 72px rgba(0, 0, 0, 0.90)) drop-shadow(0 8px 28px rgba(124, 58, 237, 0.16));
    }

    /* =====================================================================
       Liquid Glass Lightbox Modal
       ===================================================================== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
      background: radial-gradient(75% 65% at 50% 42%, rgba(18, 17, 26, 0.45) 0%, rgba(4, 4, 8, 0.88) 100%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      backdrop-filter: blur(20px) saturate(130%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-glass);
    }

    .lightbox[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      position: relative;
      max-width: min(1360px, 100%);
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.94) translateY(10px);
      filter: blur(8px);
      transition:
        transform 320ms var(--spring-fluid),
        filter 260ms var(--ease-glass);
    }

    .lightbox[data-open="true"] .lightbox-inner {
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 88vh;
      width: auto;
      height: auto;
      display: block;
      filter: drop-shadow(0 36px 90px rgba(0, 0, 0, 0.94));
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 22px;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      background-color: rgba(22, 22, 30, 0.56);
      background-image: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.05) 55%,
        rgba(139, 92, 246, 0.08) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.24);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.44),
        0 10px 26px -8px rgba(0, 0, 0, 0.72);
      cursor: pointer;
      transition:
        transform 180ms var(--spring-fluid),
        background-color 140ms var(--ease-glass),
        border-color 140ms var(--ease-glass);
    }

    .lightbox-close:hover {
      transform: scale(1.07);
      background-color: rgba(124, 58, 237, 0.44);
      border-color: rgba(237, 233, 254, 0.46);
    }

    .lightbox-close:active {
      transform: scale(0.92);
    }

    /* =====================================================================
       Quiet Single-Line Footer
       ===================================================================== */
    .quiet-footer {
      --delay: 300ms;
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 12px 20px 26px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      font-size: 0.76rem;
      color: var(--ink-muted);
    }

    .footer-link {
      color: var(--ink-muted);
      transition: color 150ms var(--ease-glass);
    }

    .footer-link:hover {
      color: var(--amethyst-ice);
    }

    /* =====================================================================
       Responsive Tuning
       ===================================================================== */
    @media (max-width: 640px) {
      .top-bar {
        padding-top: 16px;
      }

      .page-shell {
        padding-top: 28px;
      }

      .ep-liquid-download {
        width: min(100%, 320px);
        height: 50px;
        padding: 0 20px 0 8px;
        font-size: 0.94rem;
        gap: 10px;
      }

      .dl-orb-badge {
        width: 34px;
        height: 34px;
      }

      .cta-meta {
        font-size: 0.74rem;
        gap: 5px;
      }

      .showcase-stage {
        max-width: 100%;
        margin-top: 28px;
      }

      .quiet-footer {
        font-size: 0.72rem;
        gap: 6px 10px;
        padding: 16px 14px 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-reveal,
      .liquid-reveal-stage,
      .aurora-bloom,
      .btn-sheen,
      .liquid-ripple {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }

      .ep-liquid-download,
      .dl-orb-badge,
      .dl-arrow-stem,
      .screenshot-frame,
      .lightbox,
      .lightbox-inner {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="cinema-backdrop" aria-hidden="true">
    <div class="aurora-bloom"></div>
    <div class="stage-horizon"></div>
  </div>

  <header class="top-bar">
    <div class="brand-lockup">
      <img
        src="/images/epilod-party/app-icon.png"
        alt=""
        width="28"
        height="28"
        class="brand-icon"
        draggable="false"
      />
      <span>Epilod Party</span>
    </div>

    <a
      href="https://github.com/ahmednazief/epilod-party"
      target="_blank"
      rel="noopener noreferrer"
      class="top-link"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M8.5 7.5L4 12L8.5 16.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M15.5 7.5L20 12L15.5 16.5"
          stroke="#C4B5FD"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>GitHub</span>
    </a>
  </header>

  <main class="page-shell">
    <div class="hero-head">
      <h1 class="hero-title liquid-reveal">Watch movies together.</h1>
      <p class="hero-subtitle liquid-reveal">
        Watch local movies and shows together in sync on Windows.
      </p>
    </div>

    <section class="cta-block" aria-label="Download">
      <a
        id="downloadBtn"
        href="https://github.com/ahmednazief/epilod-party/releases/latest/download/Epilod.Party.Setup.exe"
        download="Epilod.Party.Setup.exe"
        class="ep-liquid-download liquid-reveal"
        style="--delay: 165ms"
        aria-label="Download Epilod Party for Windows"
      >
        <span class="btn-sheen" aria-hidden="true"></span>

        <!-- Custom Amethyst Crystal Download Droplet -->
        <span class="dl-orb-badge" id="dlIconSlot" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <g class="dl-arrow-stem">
              <path
                d="M12 4.2V14.8"
                stroke="#FFFFFF"
                stroke-width="2.05"
                stroke-linecap="round"
              />
              <path
                d="M7.9 11.1L12 15.3L16.1 11.1"
                stroke="#EDE9FE"
                stroke-width="2.05"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <path
              d="M4.8 16.4V17.7C4.8 18.86 5.74 19.8 6.9 19.8H17.1C18.26 19.8 19.2 18.86 19.2 17.7V16.4"
              stroke="#DDD6FE"
              stroke-opacity="0.92"
              stroke-width="1.85"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span class="dl-label" id="dlLabel">Download for Windows</span>
      </a>

      <div class="cta-meta num liquid-reveal" style="--delay: 205ms" aria-live="polite">
        <span class="meta-os">
          <!-- Custom Beveled Crystal Windows Crest -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.2" y="3.2" width="8" height="8" rx="1.8" fill="#EDE9FE" fill-opacity="0.88" />
            <rect x="12.8" y="3.2" width="8" height="8" rx="1.8" fill="#DDD6FE" fill-opacity="0.72" />
            <rect x="3.2" y="12.8" width="8" height="8" rx="1.8" fill="#C4B5FD" fill-opacity="0.72" />
            <rect x="12.8" y="12.8" width="8" height="8" rx="1.8" fill="#A78BFA" fill-opacity="0.88" />
          </svg>
          <span>Windows 10 &amp; 11</span>
        </span>
        <span class="meta-dot" aria-hidden="true">·</span>
        <span class="beta-indicator">Public Beta</span>
        <span class="meta-dot" aria-hidden="true">·</span>
        <span id="dlVersionChip">v0.1.0</span>
        <span class="meta-dot" aria-hidden="true">·</span>
        <span id="metaSize">39.5 MB</span>
      </div>
    </section>

    <!-- Big App Screenshot Showcase -->
    <section class="showcase-stage liquid-reveal-stage" aria-label="Epilod Party Desktop App Preview">
      <div class="showcase-halo" aria-hidden="true"></div>

      <div
        id="screenshotFrame"
        class="screenshot-frame"
        role="button"
        tabindex="0"
        aria-label="Inspect full-size Epilod Party screenshot"
      >
        <img
          id="showcaseImg"
          src="/images/epilod-party/watch-party.webp"
          alt="Epilod Party desktop app playing a sci-fi film in sync with four friends inside a Smoked-Amethyst liquid glass interface"
          width="2040"
          height="1230"
          decoding="async"
          class="screenshot-img"
          draggable="false"
        />
      </div>
    </section>
  </main>

  <footer class="quiet-footer">
    <a href="https://ahmednazif.com/" class="footer-link">ahmednazif.com</a>
    <span aria-hidden="true">·</span>
    <a
      id="releaseNotesLink"
      href="https://github.com/ahmednazief/epilod-party/releases"
      target="_blank"
      rel="noopener noreferrer"
      class="footer-link"
    >
      Releases
    </a>
    <span aria-hidden="true">·</span>
    <span>GPL-3.0</span>
  </footer>

  <!-- Full-Screen Liquid Glass Lightbox -->
  <div
    id="lightbox"
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Full-size screenshot preview"
    data-open="false"
  >
    <button type="button" id="lightboxClose" class="lightbox-close" aria-label="Close preview">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.5 6.5L17.5 17.5" stroke="#FFFFFF" stroke-width="1.95" stroke-linecap="round" />
        <path d="M17.5 6.5L6.5 17.5" stroke="#DDD6FE" stroke-width="1.95" stroke-linecap="round" />
      </svg>
    </button>
    <div class="lightbox-inner">
      <img id="lightboxImg" src="" alt="" class="lightbox-img" draggable="false" />
    </div>
  </div>

  <script>
    (function () {
      document.querySelectorAll(".liquid-reveal, .liquid-reveal-stage").forEach(function (el) {
        var settle = function () {
          el.classList.remove("liquid-reveal", "liquid-reveal-stage");
        };
        el.addEventListener(
          "animationend",
          function (e) {
            if (e.animationName === "liquidCondense" || e.animationName === "liquidCondenseStage") {
              settle();
            }
          },
          { once: true }
        );
        window.setTimeout(settle, 1500);
      });

      const REPO = "ahmednazief/epilod-party";
      const RELEASES_API = "https://api.github.com/repos/" + REPO + "/releases?per_page=6";
      const CACHE_KEY = "epilod_party_latest_release_v1";
      const CACHE_TTL_MS = 10 * 60 * 1000;

      const downloadBtn = document.getElementById("downloadBtn");
      const dlLabel = document.getElementById("dlLabel");
      const dlVersionChip = document.getElementById("dlVersionChip");
      const dlIconSlot = document.getElementById("dlIconSlot");
      const metaSize = document.getElementById("metaSize");
      const releaseNotesLink = document.getElementById("releaseNotesLink");

      const originalIconMarkup = dlIconSlot.innerHTML;
      const checkIconMarkup =
        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none">' +
        '<path d="M5.2 12.6L9.8 17.2L18.8 7.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M9.8 17.2L18.8 7.4" stroke="#DDD6FE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        "</svg>";

      function formatSizeMB(bytes) {
        if (!bytes || typeof bytes !== "number" || bytes <= 0) return null;
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function normalizeVersion(tag) {
        const clean = String(tag || "").trim().replace(/^v/i, "");
        return clean ? "v" + clean : null;
      }

      function applyReleaseInfo(info) {
        if (!info) return;
        if (info.version) {
          dlVersionChip.textContent = info.version;
        }
        if (info.sizeLabel) {
          metaSize.textContent = info.sizeLabel;
        }
        if (info.downloadUrl) {
          downloadBtn.href = info.downloadUrl;
          downloadBtn.setAttribute("download", info.assetName || "Epilod.Party.Setup.exe");
        }
        if (info.releaseUrl && releaseNotesLink) {
          releaseNotesLink.href = info.releaseUrl;
        }
      }

      function pickInstallerAsset(assets) {
        if (!Array.isArray(assets)) return null;
        const preferred = assets.find(function (a) {
          return a && typeof a.name === "string" && /epilod.*setup.*\.exe$/i.test(a.name);
        });
        if (preferred) return preferred;
        return (
          assets.find(function (a) {
            return a && typeof a.name === "string" && /\.exe$/i.test(a.name);
          }) || null
        );
      }

      async function syncLatestRelease() {
        try {
          const cachedRaw = sessionStorage.getItem(CACHE_KEY);
          if (cachedRaw) {
            const cached = JSON.parse(cachedRaw);
            if (cached && Date.now() - cached.savedAt < CACHE_TTL_MS && cached.data) {
              applyReleaseInfo(cached.data);
              return;
            }
          }
        } catch (_) {
          // Ignore storage restrictions
        }

        try {
          const res = await fetch(RELEASES_API, {
            headers: { Accept: "application/vnd.github+json" },
          });
          if (!res.ok) return;
          const releases = await res.json();
          if (!Array.isArray(releases)) return;

          for (let i = 0; i < releases.length; i++) {
            const rel = releases[i];
            if (!rel || rel.draft) continue;
            const asset = pickInstallerAsset(rel.assets);
            if (!asset || !asset.browser_download_url) continue;

            const data = {
              version: normalizeVersion(rel.tag_name || rel.name),
              sizeLabel: formatSizeMB(asset.size),
              downloadUrl: asset.browser_download_url,
              assetName: asset.name,
              releaseUrl: rel.html_url || "https://github.com/" + REPO + "/releases",
            };
            applyReleaseInfo(data);
            try {
              sessionStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data }));
            } catch (_) {
              // Ignore storage quota errors
            }
            break;
          }
        } catch (_) {
          // Keep verified static fallback intact
        }
      }

      void syncLatestRelease();

      /* -------------------------------------------------------------------
         Pointer-tracked specular rim tilt + caustic & click ripple on CTA
         ------------------------------------------------------------------- */
      let rafPending = false;
      let nextMx = "50%";
      let nextMy = "50%";
      let nextAngle = "132deg";

      downloadBtn.addEventListener("pointermove", function (e) {
        const rect = downloadBtn.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        nextMx = (px * 100).toFixed(1) + "%";
        nextMy = (py * 100).toFixed(1) + "%";
        nextAngle = Math.round(108 + (px - 0.5) * 44) + "deg";
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(function () {
            downloadBtn.style.setProperty("--mx", nextMx);
            downloadBtn.style.setProperty("--my", nextMy);
            downloadBtn.style.setProperty("--rim-angle", nextAngle);
            rafPending = false;
          });
        }
      });

      downloadBtn.addEventListener("pointerleave", function () {
        downloadBtn.style.setProperty("--mx", "50%");
        downloadBtn.style.setProperty("--my", "50%");
        downloadBtn.style.setProperty("--rim-angle", "132deg");
      });

      let feedbackTimer = null;

      downloadBtn.addEventListener("click", function (e) {
        const rect = downloadBtn.getBoundingClientRect();
        const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
        const y = e.clientY ? e.clientY - rect.top : rect.height / 2;

        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const ripple = document.createElement("span");
          ripple.className = "liquid-ripple";
          const diameter = Math.max(rect.width, rect.height);
          ripple.style.width = diameter + "px";
          ripple.style.height = diameter + "px";
          ripple.style.left = x + "px";
          ripple.style.top = y + "px";
          downloadBtn.appendChild(ripple);
          window.setTimeout(function () {
            ripple.remove();
          }, 700);
        }

        dlLabel.textContent = "Starting download…";
        dlIconSlot.innerHTML = checkIconMarkup;
        if (feedbackTimer) window.clearTimeout(feedbackTimer);
        feedbackTimer = window.setTimeout(function () {
          dlLabel.textContent = "Download for Windows";
          dlIconSlot.innerHTML = originalIconMarkup;
        }, 2600);
      });

      /* -------------------------------------------------------------------
         Lightbox Inspection
         ------------------------------------------------------------------- */
      const screenshotFrame = document.getElementById("screenshotFrame");
      const showcaseImg = document.getElementById("showcaseImg");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxClose = document.getElementById("lightboxClose");

      function openLightbox() {
        lightboxImg.src = showcaseImg.src;
        lightboxImg.alt = showcaseImg.alt;
        lightbox.setAttribute("data-open", "true");
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.setAttribute("data-open", "false");
        document.body.style.overflow = "";
      }

      screenshotFrame.addEventListener("click", openLightbox);
      screenshotFrame.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openLightbox();
        }
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", function (e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && lightbox.getAttribute("data-open") === "true") {
          closeLightbox();
        }
      });
    })();
  </script>
</body>
</html>
