  <style>
    :root {
      --canvas: #060608;
      --ink-primary: #f4f4f6;
      --ink-secondary: #a1a1aa;
      --ink-muted: #71717a;

      --amethyst: #7c3aed;
      --amethyst-bright: #8b5cf6;
      --amethyst-soft: #c4b5fd;
      --amethyst-ice: #ddd6fe;
      --amethyst-mist: #ede9fe;

      --spring-fluid: cubic-bezier(0.22, 1.24, 0.36, 1);
      --spring-soft: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-glass: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--canvas);
      color: var(--ink-primary);
      font-family: "Inter", "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--canvas);
      background-image:
        radial-gradient(70% 50% at 50% 0%, rgba(255, 255, 255, 0.025) 0%, rgba(255, 255, 255, 0) 70%),
        radial-gradient(60% 48% at 50% 100%, rgba(124, 58, 237, 0.045) 0%, rgba(124, 58, 237, 0) 74%);
      color: var(--ink-primary);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }

    .num {
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }

    /* =====================================================================
       Ambient Refracted Light Stage (behind translucent liquid glass)
       ===================================================================== */
    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .ambient-orb-purple {
      position: absolute;
      left: 50%;
      top: 10%;
      width: min(760px, 95vw);
      height: min(560px, 72vw);
      transform: translateX(-58%);
      border-radius: 50%;
      background: radial-gradient(
        circle at 46% 42%,
        rgba(139, 92, 246, 0.24) 0%,
        rgba(124, 58, 237, 0.10) 42%,
        rgba(124, 58, 237, 0) 72%
      );
      filter: blur(56px);
      animation: orbDriftPurple 11s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .ambient-orb-silver {
      position: absolute;
      left: 50%;
      top: 18%;
      width: min(640px, 85vw);
      height: min(480px, 65vw);
      transform: translateX(-34%);
      border-radius: 50%;
      background: radial-gradient(
        circle at 55% 50%,
        rgba(228, 228, 236, 0.10) 0%,
        rgba(161, 161, 170, 0.04) 46%,
        rgba(161, 161, 170, 0) 74%
      );
      filter: blur(58px);
      animation: orbDriftSilver 13s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes orbDriftPurple {
      0% {
        transform: translate3d(-58%, 0, 0) scale(1);
        opacity: 0.78;
      }
      100% {
        transform: translate3d(-54%, 18px, 0) scale(1.07);
        opacity: 1;
      }
    }

    @keyframes orbDriftSilver {
      0% {
        transform: translate3d(-34%, 6px, 0) scale(1);
        opacity: 0.65;
      }
      100% {
        transform: translate3d(-38%, -12px, 0) scale(1.06);
        opacity: 0.9;
      }
    }

    /* =====================================================================
       Page Shell
       ===================================================================== */
    .page-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(52px, 8vh, 88px) clamp(18px, 4vw, 40px) 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* =====================================================================
       Optical Condensation Reveal Choreography
       ===================================================================== */
    .liquid-reveal {
      opacity: 0;
      transform: translateY(16px) scale(0.968);
      filter: blur(11px);
      animation: liquidCondense 740ms var(--spring-soft) forwards;
      animation-delay: var(--delay, 0ms);
    }

    .liquid-reveal-stage {
      opacity: 0;
      transform: translateY(24px) scale(0.962);
      filter: blur(14px);
      animation: liquidCondenseStage 860ms var(--spring-soft) forwards;
      animation-delay: var(--delay, 260ms);
    }

    @keyframes liquidCondense {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.968);
        filter: blur(11px);
      }
      100% {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @keyframes liquidCondenseStage {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.962);
        filter: blur(14px);
      }
      100% {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    /* =====================================================================
       Hero Header
       ===================================================================== */
    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-icon-wrap {
      --delay: 20ms;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      transition: transform 320ms var(--spring-fluid);
    }

    .app-icon-wrap::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 30px;
      background: radial-gradient(
        circle at 50% 45%,
        rgba(139, 92, 246, 0.34) 0%,
        rgba(124, 58, 237, 0.12) 48%,
        transparent 74%
      );
      filter: blur(16px);
      z-index: -1;
      transition: opacity 260ms var(--ease-glass), transform 320ms var(--spring-fluid);
    }

    .app-icon-wrap:hover {
      transform: translateY(-2px) scale(1.045);
    }

    .app-icon-wrap:hover::before {
      transform: scale(1.12);
    }

    .app-icon {
      width: 68px;
      height: 68px;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 12px 26px rgba(124, 58, 237, 0.32));
    }

    .hero-title {
      --delay: 85ms;
      font-size: clamp(2.25rem, 5vw, 3.4rem);
      font-weight: 650;
      letter-spacing: -0.036em;
      line-height: 1.06;
      color: #ffffff;
      text-shadow: 0 2px 24px rgba(139, 92, 246, 0.16);
    }

    .hero-subtitle {
      --delay: 145ms;
      margin-top: 12px;
      max-width: 460px;
      font-size: clamp(0.98rem, 1.8vw, 1.12rem);
      font-weight: 420;
      line-height: 1.5;
      letter-spacing: -0.01em;
      color: var(--ink-secondary);
    }

    /* =====================================================================
       Big iOS 27 Smoked-Amethyst Liquid Glass Download Button
       ===================================================================== */
    .cta-block {
      --delay: 205ms;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .ep-liquid-download {
      --mx: 50%;
      --my: 50%;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 58px;
      padding: 0 34px;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 1.03rem;
      font-weight: 560;
      letter-spacing: -0.015em;
      cursor: pointer;
      user-select: none;
      background-color: rgba(16, 11, 30, 0.62);
      background-image:
        radial-gradient(
          140px circle at var(--mx) var(--my),
          rgba(237, 233, 254, 0.16) 0%,
          rgba(167, 139, 250, 0.08) 45%,
          rgba(167, 139, 250, 0) 74%
        ),
        linear-gradient(
          168deg,
          rgba(167, 139, 250, 0.22) 0%,
          rgba(124, 58, 237, 0.30) 52%,
          rgba(91, 33, 182, 0.38) 100%
        );
      background-clip: padding-box;
      border: 1px solid rgba(221, 214, 254, 0.30);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.40),
        inset 0 -1px 0 0 rgba(196, 181, 253, 0.18),
        inset 0 0 16px 0 rgba(124, 58, 237, 0.18),
        0 14px 36px -10px rgba(124, 58, 237, 0.44),
        0 4px 14px -4px rgba(0, 0, 0, 0.72);
      transition:
        transform 240ms var(--spring-fluid),
        background-color 180ms var(--ease-glass),
        border-color 180ms var(--ease-glass),
        box-shadow 220ms var(--ease-glass);
    }

    /* Ultra-subtle top optical rim highlight */
    .ep-liquid-download::before {
      content: "";
      position: absolute;
      inset: 0 20px auto 20px;
      height: 1px;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      opacity: 0.78;
      transition: opacity 180ms var(--ease-glass);
    }

    /* Soft lower internal amethyst refraction */
    .ep-liquid-download::after {
      content: "";
      position: absolute;
      inset: auto 24px 1px 24px;
      height: 28%;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        80% 100% at 50% 100%,
        rgba(196, 181, 253, 0.24) 0%,
        rgba(139, 92, 246, 0) 100%
      );
      opacity: 0.65;
      transition: opacity 180ms var(--ease-glass);
    }

    /* One-shot diagonal specular glass sweep on initial settle */
    .btn-sheen {
      position: absolute;
      top: -20%;
      left: -42%;
      width: 30%;
      height: 140%;
      pointer-events: none;
      z-index: 1;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(237, 233, 254, 0.24) 48%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-18deg) translateX(0);
      opacity: 0;
      animation: glassSweep 1150ms var(--ease-glass) 820ms 1 forwards;
    }

    @keyframes glassSweep {
      0% {
        transform: skewX(-18deg) translateX(0);
        opacity: 0;
      }
      18% {
        opacity: 0.75;
      }
      82% {
        opacity: 0.55;
      }
      100% {
        transform: skewX(-18deg) translateX(480%);
        opacity: 0;
      }
    }

    .ep-liquid-download > *:not(.btn-sheen):not(.liquid-ripple) {
      position: relative;
      z-index: 2;
    }

    .ep-liquid-download:hover {
      transform: translateY(-2px) scale(1.022);
      background-color: rgba(24, 15, 46, 0.72);
      border-color: rgba(237, 233, 254, 0.48);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.58),
        inset 0 -1px 0 0 rgba(221, 214, 254, 0.28),
        inset 0 0 22px 0 rgba(139, 92, 246, 0.28),
        0 18px 44px -8px rgba(124, 58, 237, 0.58),
        0 6px 18px -4px rgba(0, 0, 0, 0.78);
    }

    .ep-liquid-download:hover::before {
      opacity: 1;
    }

    .ep-liquid-download:hover::after {
      opacity: 0.92;
    }

    .ep-liquid-download:active,
    .ep-liquid-download.is-pressing {
      transform: scale(0.96);
      transition-duration: 75ms;
      transition-timing-function: ease-out;
    }

    .ep-liquid-download:focus-visible {
      outline: 2px solid rgba(221, 214, 254, 0.78);
      outline-offset: 4px;
    }

    .dl-icon-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .dl-arrow-stem {
      transition: transform 260ms var(--spring-fluid);
      transform-origin: center;
    }

    .ep-liquid-download:hover .dl-arrow-stem {
      transform: translateY(2px);
    }

    .ep-liquid-download:active .dl-arrow-stem {
      transform: translateY(3px) scaleY(0.92);
    }

    .dl-label {
      white-space: nowrap;
      text-shadow: 0 1px 6px rgba(10, 4, 24, 0.5);
    }

    /* Click radial liquid shockwave inside the button */
    .liquid-ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.46) 0%,
        rgba(221, 214, 254, 0.26) 40%,
        rgba(139, 92, 246, 0) 74%
      );
      transform: translate(-50%, -50%) scale(0);
      animation: liquidRippleOut 680ms var(--ease-glass) forwards;
    }

    @keyframes liquidRippleOut {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }

    /* Quiet single-line metadata beneath CTA */
    .cta-meta {
      --delay: 255ms;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8125rem;
      font-weight: 450;
      color: var(--ink-secondary);
      letter-spacing: -0.005em;
    }

    .meta-os {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-primary);
      font-weight: 500;
    }

    .meta-dot {
      color: var(--ink-muted);
      user-select: none;
    }

    .beta-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--amethyst-ice);
      font-weight: 500;
    }

    .beta-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amethyst-soft);
      box-shadow: 0 0 10px rgba(196, 181, 253, 0.85);
      animation: betaBreathe 2.8s ease-in-out infinite;
    }

    @keyframes betaBreathe {
      0%, 100% {
        opacity: 0.72;
        transform: scale(0.95);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* =====================================================================
       Big App Screenshot Showcase (directly below Download button)
       ===================================================================== */
    .showcase-wrap {
      width: 100%;
      max-width: 1100px;
      margin-top: clamp(36px, 5.5vh, 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .showcase-stage {
      --delay: 310ms;
      position: relative;
      width: 100%;
      aspect-ratio: 2720 / 1640;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Soft amethyst ambient halo under/behind the floating window screenshot */
    .showcase-halo {
      position: absolute;
      inset: 6% 8% -4% 8%;
      border-radius: 40px;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(65% 60% at 50% 42%, rgba(124, 58, 237, 0.20) 0%, rgba(124, 58, 237, 0.05) 55%, transparent 78%),
        radial-gradient(50% 40% at 25% 75%, rgba(167, 139, 250, 0.10) 0%, transparent 72%);
      filter: blur(46px);
      opacity: 0.92;
      transition: opacity 400ms var(--ease-glass);
    }

    .screenshot-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      cursor: zoom-in;
      transition: transform 420ms var(--spring-soft);
    }

    .screenshot-frame:hover {
      transform: translateY(-2px);
    }

    .screenshot-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 32px 72px rgba(0, 0, 0, 0.88)) drop-shadow(0 8px 28px rgba(124, 58, 237, 0.14));
      transition:
        opacity 260ms var(--ease-glass),
        transform 380ms var(--spring-soft),
        filter 320ms var(--ease-glass);
      will-change: opacity, transform, filter;
    }

    .screenshot-img.is-swapping {
      opacity: 0;
      transform: scale(0.986);
      filter: blur(10px) drop-shadow(0 32px 72px rgba(0, 0, 0, 0.88));
    }

    /* Subtle hover-only expand pill tucked cleanly inside corner */
    .expand-pill {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 3;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.88);
      background-color: rgba(14, 14, 22, 0.56);
      background-image: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.04) 55%,
        rgba(139, 92, 246, 0.08) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.20);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      box-shadow:
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.36),
        0 8px 20px -6px rgba(0, 0, 0, 0.72);
      opacity: 0;
      transform: scale(0.9);
      cursor: pointer;
      transition:
        opacity 200ms var(--ease-glass),
        transform 240ms var(--spring-fluid),
        border-color 160ms var(--ease-glass),
        background-color 160ms var(--ease-glass);
    }

    .screenshot-frame:hover .expand-pill,
    .expand-pill:focus-visible {
      opacity: 1;
      transform: scale(1);
    }

    .expand-pill:hover {
      transform: scale(1.08);
      background-color: rgba(124, 58, 237, 0.45);
      border-color: rgba(237, 233, 254, 0.42);
    }

    .expand-pill:active {
      transform: scale(0.93);
      transition-duration: 70ms;
    }

    .expand-pill:focus-visible {
      outline: 1.5px solid rgba(221, 214, 254, 0.75);
      outline-offset: 2px;
    }

    /* =====================================================================
       Morphing Liquid-Droplet View Switcher (mirrors Epilod SegmentedTabs)
       ===================================================================== */
    .switcher-row {
      --delay: 375ms;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .ep-glass-tray {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 9999px;
      background-color: rgba(10, 10, 14, 0.72);
      background-image: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.04) 0%,
        rgba(255, 255, 255, 0.015) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.09);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      backdrop-filter: blur(20px) saturate(140%);
      box-shadow:
        inset 0 1px 3px 0 rgba(0, 0, 0, 0.55),
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
        0 10px 28px -10px rgba(0, 0, 0, 0.70);
    }

    .droplet-track {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      pointer-events: none;
      transition:
        transform 460ms cubic-bezier(0.22, 1.26, 0.36, 1),
        width 460ms cubic-bezier(0.22, 1.26, 0.36, 1);
      will-change: transform, width;
    }

    .ep-droplet-indicator {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background-color: rgba(124, 58, 237, 0.32);
      background-image: linear-gradient(
        175deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(139, 92, 246, 0.16) 50%,
        rgba(109, 40, 217, 0.28) 100%
      );
      box-shadow:
        inset 0 0 0 1px rgba(221, 214, 254, 0.34),
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0.5px 0 rgba(196, 181, 253, 0.18),
        0 4px 16px -2px rgba(124, 58, 237, 0.44);
      transform-origin: center center;
      transition:
        transform 340ms cubic-bezier(0.22, 1.38, 0.34, 1),
        filter 220ms var(--ease-glass);
      will-change: transform, filter;
    }

    .ep-droplet-indicator[data-morphing="true"] {
      transform: scaleX(1.14) scaleY(0.86);
      filter: brightness(1.18);
    }

    .view-tab {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 15px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--ink-secondary);
      white-space: nowrap;
      cursor: pointer;
      transition:
        transform 140ms var(--ease-glass),
        color 180ms var(--ease-glass),
        text-shadow 180ms var(--ease-glass);
    }

    .view-tab:hover:not([aria-selected="true"]) {
      color: var(--ink-primary);
    }

    .view-tab[aria-selected="true"] {
      color: #ffffff;
      text-shadow: 0 0 14px rgba(237, 233, 254, 0.35);
    }

    .view-tab:active {
      transform: scale(0.955);
      transition-duration: 70ms;
    }

    .view-tab:focus-visible {
      outline: 1.5px solid rgba(221, 214, 254, 0.65);
      outline-offset: -1px;
    }

    .tab-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.78;
      transition: opacity 150ms var(--ease-glass);
    }

    .view-tab[aria-selected="true"] .tab-icon {
      opacity: 1;
    }

    /* =====================================================================
       Liquid Glass Lightbox Modal
       ===================================================================== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
      background: radial-gradient(75% 65% at 50% 42%, rgba(18, 17, 26, 0.45) 0%, rgba(4, 4, 8, 0.86) 100%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-glass);
    }

    .lightbox[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      position: relative;
      max-width: min(1360px, 100%);
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.94) translateY(10px);
      filter: blur(8px);
      transition:
        transform 320ms var(--spring-fluid),
        filter 260ms var(--ease-glass);
    }

    .lightbox[data-open="true"] .lightbox-inner {
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 88vh;
      width: auto;
      height: auto;
      display: block;
      filter: drop-shadow(0 36px 90px rgba(0, 0, 0, 0.94));
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 22px;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      background-color: rgba(22, 22, 30, 0.56);
      background-image: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.05) 55%,
        rgba(139, 92, 246, 0.08) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.24);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.44),
        0 10px 26px -8px rgba(0, 0, 0, 0.72);
      cursor: pointer;
      transition:
        transform 180ms var(--spring-fluid),
        background-color 140ms var(--ease-glass),
        border-color 140ms var(--ease-glass);
    }

    .lightbox-close:hover {
      transform: scale(1.07);
      background-color: rgba(124, 58, 237, 0.44);
      border-color: rgba(237, 233, 254, 0.46);
    }

    .lightbox-close:active {
      transform: scale(0.92);
    }

    /* =====================================================================
       Minimal Single-Line Footer
       ===================================================================== */
    .quiet-footer {
      --delay: 420ms;
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 20px 20px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-muted);
      transition: color 150ms var(--ease-glass);
    }

    .footer-link:hover {
      color: var(--amethyst-ice);
    }

    /* =====================================================================
       Responsive Tuning
       ===================================================================== */
    @media (max-width: 640px) {
      .page-shell {
        padding-top: 40px;
      }

      .app-icon {
        width: 58px;
        height: 58px;
      }

      .ep-liquid-download {
        width: min(100%, 320px);
        height: 52px;
        padding: 0 22px;
        font-size: 0.94rem;
        gap: 10px;
      }

      .cta-meta {
        font-size: 0.74rem;
        gap: 5px;
      }

      .view-tab {
        height: 32px;
        padding: 0 11px;
        font-size: 0.74rem;
        gap: 5px;
      }

      .tab-icon {
        display: none;
      }

      .expand-pill {
        display: none;
      }

      .quiet-footer {
        font-size: 0.72rem;
        gap: 6px 8px;
        padding: 18px 14px 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-reveal,
      .liquid-reveal-stage,
      .ambient-orb-purple,
      .ambient-orb-silver,
      .btn-sheen,
      .beta-pulse,
      .liquid-ripple {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }

      .ep-liquid-download,
      .dl-arrow-stem,
      .droplet-track,
      .ep-droplet-indicator,
      .screenshot-frame,
      .screenshot-img,
      .expand-pill,
      .lightbox,
      .lightbox-inner {
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      document.querySelectorAll(".liquid-reveal, .liquid-reveal-stage").forEach(function (el) {
        var settle = function () {
          el.classList.remove("liquid-reveal", "liquid-reveal-stage");
        };
        el.addEventListener(
          "animationend",
          function (e) {
            if (e.animationName === "liquidCondense" || e.animationName === "liquidCondenseStage") {
              settle();
            }
          },
          { once: true }
        );
        window.setTimeout(settle, 1600);
      });

      const REPO = "ahmednazief/epilod-party";
      const RELEASES_API = "https://api.github.com/repos/" + REPO + "/releases?per_page=6";
      const CACHE_KEY = "epilod_party_latest_release_v1";
      const CACHE_TTL_MS = 10 * 60 * 1000;

      const downloadBtn = document.getElementById("downloadBtn");
      const dlLabel = document.getElementById("dlLabel");
      const dlVersionChip = document.getElementById("dlVersionChip");
      const dlIconSlot = document.getElementById("dlIconSlot");
      const metaSize = document.getElementById("metaSize");
      const releaseNotesLink = document.getElementById("releaseNotesLink");

      const originalIconMarkup = dlIconSlot.innerHTML;
      const checkIconMarkup =
        '<svg width="21" height="21" viewBox="0 0 24 24" fill="none">' +
        '<path d="M5.2 12.6L9.8 17.2L18.8 7.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M9.8 17.2L18.8 7.4" stroke="#DDD6FE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        "</svg>";

      function formatSizeMB(bytes) {
        if (!bytes || typeof bytes !== "number" || bytes <= 0) return null;
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function normalizeVersion(tag) {
        const clean = String(tag || "").trim().replace(/^v/i, "");
        return clean ? "v" + clean : null;
      }

      function applyReleaseInfo(info) {
        if (!info) return;
        if (info.version) {
          dlVersionChip.textContent = info.version;
        }
        if (info.sizeLabel) {
          metaSize.textContent = info.sizeLabel;
        }
        if (info.downloadUrl) {
          downloadBtn.href = info.downloadUrl;
          downloadBtn.setAttribute("download", info.assetName || "Epilod.Party.Setup.exe");
        }
        if (info.releaseUrl && releaseNotesLink) {
          releaseNotesLink.href = info.releaseUrl;
        }
      }

      function pickInstallerAsset(assets) {
        if (!Array.isArray(assets)) return null;
        const preferred = assets.find(function (a) {
          return a && typeof a.name === "string" && /epilod.*setup.*\.exe$/i.test(a.name);
        });
        if (preferred) return preferred;
        return (
          assets.find(function (a) {
            return a && typeof a.name === "string" && /\.exe$/i.test(a.name);
          }) || null
        );
      }

      async function syncLatestRelease() {
        try {
          const cachedRaw = sessionStorage.getItem(CACHE_KEY);
          if (cachedRaw) {
            const cached = JSON.parse(cachedRaw);
            if (cached && Date.now() - cached.savedAt < CACHE_TTL_MS && cached.data) {
              applyReleaseInfo(cached.data);
              return;
            }
          }
        } catch (_) {
          // Ignore storage restrictions
        }

        try {
          const res = await fetch(RELEASES_API, {
            headers: { Accept: "application/vnd.github+json" },
          });
          if (!res.ok) return;
          const releases = await res.json();
          if (!Array.isArray(releases)) return;

          for (let i = 0; i < releases.length; i++) {
            const rel = releases[i];
            if (!rel || rel.draft) continue;
            const asset = pickInstallerAsset(rel.assets);
            if (!asset || !asset.browser_download_url) continue;

            const data = {
              version: normalizeVersion(rel.tag_name || rel.name),
              sizeLabel: formatSizeMB(asset.size),
              downloadUrl: asset.browser_download_url,
              assetName: asset.name,
              releaseUrl: rel.html_url || "https://github.com/" + REPO + "/releases",
            };
            applyReleaseInfo(data);
            try {
              sessionStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data }));
            } catch (_) {
              // Ignore storage quota errors
            }
            break;
          }
        } catch (_) {
          // Keep verified static fallback intact
        }
      }

      void syncLatestRelease();

      /* -------------------------------------------------------------------
         Pointer-tracked specular caustic & liquid click shockwave on CTA
         ------------------------------------------------------------------- */
      let rafPending = false;
      let nextMx = "50%";
      let nextMy = "50%";

      downloadBtn.addEventListener("pointermove", function (e) {
        const rect = downloadBtn.getBoundingClientRect();
        nextMx = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1) + "%";
        nextMy = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1) + "%";
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(function () {
            downloadBtn.style.setProperty("--mx", nextMx);
            downloadBtn.style.setProperty("--my", nextMy);
            rafPending = false;
          });
        }
      });

      downloadBtn.addEventListener("pointerleave", function () {
        downloadBtn.style.setProperty("--mx", "50%");
        downloadBtn.style.setProperty("--my", "50%");
      });

      let feedbackTimer = null;

      downloadBtn.addEventListener("click", function (e) {
        const rect = downloadBtn.getBoundingClientRect();
        const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
        const y = e.clientY ? e.clientY - rect.top : rect.height / 2;

        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const ripple = document.createElement("span");
          ripple.className = "liquid-ripple";
          const diameter = Math.max(rect.width, rect.height);
          ripple.style.width = diameter + "px";
          ripple.style.height = diameter + "px";
          ripple.style.left = x + "px";
          ripple.style.top = y + "px";
          downloadBtn.appendChild(ripple);
          window.setTimeout(function () {
            ripple.remove();
          }, 700);
        }

        dlLabel.textContent = "Starting download…";
        dlIconSlot.innerHTML = checkIconMarkup;
        if (feedbackTimer) window.clearTimeout(feedbackTimer);
        feedbackTimer = window.setTimeout(function () {
          dlLabel.textContent = "Download for Windows";
          dlIconSlot.innerHTML = originalIconMarkup;
        }, 2600);
      });

      /* -------------------------------------------------------------------
         Liquid-Droplet Screenshot Switcher
         ------------------------------------------------------------------- */
      const tabsContainer = document.getElementById("viewTabs");
      const tabs = Array.from(tabsContainer.querySelectorAll('[role="tab"]'));
      const dropletTrack = document.getElementById("dropletTrack");
      const dropletCore = document.getElementById("dropletCore");
      const showcaseImg = document.getElementById("showcaseImg");

      let morphTimer = null;
      let swapTimer = null;

      function positionDroplet(targetTab, animate) {
        if (!targetTab) return;
        if (!animate) {
          dropletTrack.style.transition = "none";
        }
        dropletTrack.style.width = targetTab.offsetWidth + "px";
        dropletTrack.style.transform = "translateX(" + targetTab.offsetLeft + "px)";
        if (!animate) {
          void dropletTrack.offsetWidth;
          dropletTrack.style.transition = "";
        }
      }

      function selectTab(nextTab) {
        const currentTab = tabs.find(function (t) {
          return t.getAttribute("aria-selected") === "true";
        });
        if (!nextTab || currentTab === nextTab) return;

        tabs.forEach(function (t) {
          t.setAttribute("aria-selected", t === nextTab ? "true" : "false");
        });

        positionDroplet(nextTab, true);
        dropletCore.setAttribute("data-morphing", "true");
        if (morphTimer) window.clearTimeout(morphTimer);
        morphTimer = window.setTimeout(function () {
          dropletCore.removeAttribute("data-morphing");
        }, 190);

        const nextSrc = nextTab.getAttribute("data-src");
        const nextAlt = nextTab.getAttribute("data-alt") || "";
        if (!nextSrc) return;

        if (swapTimer) window.clearTimeout(swapTimer);
        showcaseImg.classList.add("is-swapping");

        const loader = new Image();
        let swapped = false;
        const commitSwap = function () {
          if (swapped) return;
          swapped = true;
          showcaseImg.src = nextSrc;
          showcaseImg.alt = nextAlt;
          requestAnimationFrame(function () {
            showcaseImg.classList.remove("is-swapping");
          });
        };

        loader.onload = function () {
          swapTimer = window.setTimeout(commitSwap, 110);
        };
        loader.onerror = commitSwap;
        loader.src = nextSrc;
        if (loader.complete) {
          swapTimer = window.setTimeout(commitSwap, 110);
        }
      }

      tabs.forEach(function (tab, index) {
        tab.addEventListener("click", function () {
          selectTab(tab);
        });
        tab.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            const next = tabs[(index + 1) % tabs.length];
            next.focus();
            selectTab(next);
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            const prev = tabs[(index - 1 + tabs.length) % tabs.length];
            prev.focus();
            selectTab(prev);
          }
        });
      });

      const initialActive = tabs.find(function (t) {
        return t.getAttribute("aria-selected") === "true";
      });
      positionDroplet(initialActive, false);

      let lastTrayWidth = tabsContainer.offsetWidth;
      window.addEventListener("resize", function () {
        const nextW = tabsContainer.offsetWidth;
        if (Math.abs(nextW - lastTrayWidth) >= 2) {
          lastTrayWidth = nextW;
          const active = tabs.find(function (t) {
            return t.getAttribute("aria-selected") === "true";
          });
          positionDroplet(active, false);
        }
      });

      /* Gently warm non-default screenshot WebPs once page settles */
      window.addEventListener("load", function () {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            const newW = tabsContainer.offsetWidth;
            if (Math.abs(newW - lastTrayWidth) >= 2) {
              lastTrayWidth = newW;
              const active = tabs.find(function (t) {
                return t.getAttribute("aria-selected") === "true";
              });
              positionDroplet(active, false);
            }
          });
        }
        window.setTimeout(function () {
          tabs.forEach(function (tab) {
            if (tab.getAttribute("aria-selected") !== "true") {
              const img = new Image();
              img.src = tab.getAttribute("data-src");
            }
          });
        }, 900);
      });

      /* -------------------------------------------------------------------
         Lightbox Inspection
         ------------------------------------------------------------------- */
      const screenshotFrame = document.getElementById("screenshotFrame");
      const expandBtn = document.getElementById("expandBtn");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxClose = document.getElementById("lightboxClose");

      function openLightbox() {
        lightboxImg.src = showcaseImg.src;
        lightboxImg.alt = showcaseImg.alt;
        lightbox.setAttribute("data-open", "true");
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.setAttribute("data-open", "false");
        document.body.style.overflow = "";
      }

      screenshotFrame.addEventListener("click", openLightbox);
      expandBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox();
      });
      screenshotFrame.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openLightbox();
        }
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", function (e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && lightbox.getAttribute("data-open") === "true") {
          closeLightbox();
        }
      });
    })();
  </script>
</body>
</html>
