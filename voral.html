<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYE6X0HX68"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BYE6X0HX68');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Voral — Test Edit | Ahmed Nazif</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">

    <style>
        :root {
            --bg: #06070a;
            --surface: rgba(18, 22, 32, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(167, 139, 250, 0.45);
            
            --purple: #8b5cf6;
            --purple-light: #a78bfa;
            --purple-glow: rgba(139, 92, 246, 0.35);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --radius-md: 14px;
            --radius-phone: 28px;
            --radius-pill: 9999px;
            
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.18), transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 120%, rgba(56, 189, 248, 0.08), transparent 70%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(circle at 50% 40%, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 40%, transparent 80%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 36px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── HEADER ── */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 32px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
            opacity: 0.9;
            transition: opacity 0.2s var(--ease);
        }

        .brand-link:hover {
            opacity: 1;
        }

        .brand-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--purple-light);
            object-fit: cover;
        }

        .client-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .client-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px #34d399;
        }

        /* ── TITLE ── */
        .title-section {
            text-align: center;
            margin-top: 14px;
            margin-bottom: 24px;
        }

        .title {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .client-name {
            background: linear-gradient(135deg, #ffffff 30%, var(--purple-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .specs-line {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-dim);
            letter-spacing: 0.04em;
        }

        /* ══════════════════════════════════════════
           CUSTOM BESPOKE 9:16 VIDEO PLAYER
        ══════════════════════════════════════════ */
        .custom-player {
            width: 100%;
            max-width: 380px;
            position: relative;
            border-radius: var(--radius-md);
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95), 0 0 45px -8px var(--purple-glow);
            overflow: hidden;
            margin-bottom: 22px;
            user-select: none;
            -webkit-user-select: none;
            transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }

        .custom-player:hover {
            border-color: var(--border-hover);
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 1), 0 0 55px -5px rgba(139, 92, 246, 0.45);
        }

        .video-viewport {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video#mainVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        /* Top Overlay Chips & Quality Selector */
        .player-top-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.3s var(--ease);
        }

        .quality-wrapper {
            position: relative;
            pointer-events: auto;
        }

        .quality-toggle-btn {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.03em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s var(--ease);
        }

        .quality-toggle-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: var(--purple-light);
        }

        .quality-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px #34d399;
        }

        /* Quality Dropdown Menu */
        .quality-menu {
            position: absolute;
            top: 34px;
            left: 0;
            background: rgba(10, 14, 22, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 6px;
            min-width: 170px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 30;
        }

        .quality-menu.show {
            display: flex;
        }

        .quality-option {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s var(--ease);
        }

        .quality-option:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #fff;
        }

        .quality-option.active {
            color: #fff;
            background: rgba(139, 92, 246, 0.35);
            font-weight: 700;
        }

        .quality-option span.tag {
            font-size: 0.6rem;
            color: var(--text-dim);
        }

        .quality-option.active span.tag {
            color: var(--purple-light);
        }

        .sound-indicator {
            pointer-events: auto;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .sound-indicator:hover {
            background: rgba(139, 92, 246, 0.6);
            border-color: var(--purple-light);
            transform: scale(1.08);
        }

        /* Big Play/Pause Center Icon (TikTok/Reel Style) */
        .play-center-btn {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(13, 16, 26, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px var(--purple-glow);
            color: #ffffff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 15;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s var(--ease);
            opacity: 0;
            transform: scale(0.7);
        }

        .play-center-btn i {
            margin-left: 3px;
        }

        .play-center-btn.is-pause i {
            margin-left: 0;
        }

        .custom-player.paused .play-center-btn {
            opacity: 1;
            transform: scale(1);
        }

        .play-center-btn.pulse-pop {
            opacity: 1 !important;
            animation: popFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popFade {
            0% { transform: scale(0.8); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Floating Bespoke Bottom Control Bar */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 14px 14px;
            background: linear-gradient(to top, rgba(5, 7, 10, 0.95) 0%, rgba(5, 7, 10, 0.6) 70%, transparent 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
        }

        .custom-player.playing.hide-controls .player-controls,
        .custom-player.playing.hide-controls .player-top-overlay {
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
        }

        /* Sleek Timeline Seeker Bar */
        .seeker-container {
            width: 100%;
            height: 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .seeker-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 99px;
            position: relative;
            overflow: visible;
            transition: height 0.15s var(--ease);
        }

        .seeker-container:hover .seeker-track {
            height: 6px;
        }

        .seeker-buffer {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 99px;
            pointer-events: none;
        }

        .seeker-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.7);
            border-radius: 99px;
            pointer-events: none;
        }

        .seeker-thumb {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #a78bfa;
            transition: transform 0.15s var(--ease);
        }

        .seeker-container:hover .seeker-thumb {
            transform: translateY(-50%) scale(1);
        }

        /* Controls Bottom Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: all 0.2s var(--ease);
            opacity: 0.88;
        }

        .ctrl-btn:hover {
            opacity: 1;
            color: var(--purple-light);
            transform: scale(1.1);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .time-display {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .time-display .current {
            color: #ffffff;
            font-weight: 600;
        }

        /* Speed Badge Button */
        .speed-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .speed-toggle:hover {
            background: var(--purple);
            border-color: var(--purple-light);
            color: #ffffff;
        }

        /* ── ACTIONS (BIG DOWNLOAD BUTTON) ── */
        .actions-section {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-download-master {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-family: var(--font-display);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
            cursor: pointer;
            transition: all 0.25s var(--ease);
            position: relative;
            overflow: hidden;
        }

        .btn-download-master:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(124, 58, 237, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        .btn-download-master:active {
            transform: translateY(0);
        }

        .dl-icon {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dl-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .dl-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .dl-sub {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 3px;
        }

        .sub-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s var(--ease);
        }

        .btn-ghost:hover {
            color: #fff;
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.03);
        }

        /* ── FOOTER ── */
        .footer {
            width: 100%;
            padding: 20px 0 24px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--text-muted);
            transition: color 0.2s var(--ease);
        }

        .footer a:hover {
            color: var(--purple-light);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            background: #181c26;
            color: #fff;
            border: 1px solid var(--purple-light);
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transform: translateY(60px);
            opacity: 0;
            transition: all 0.25s var(--ease);
            z-index: 999;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 14px 12px 28px;
            }
            .custom-player {
                max-width: 100%;
                border-radius: var(--radius-md);
            }
            .title {
                font-size: 1.5rem;
            }
            .btn-download-master {
                padding: 15px 20px;
            }
            .dl-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- TOP MINIMAL NAV -->
        <header class="header">
            <a href="https://ahmednazif.com" class="brand-link" title="Ahmed Nazif Portfolio">
                <img src="/profile.jpg" alt="Ahmed Nazif" class="brand-avatar" onerror="this.src='/images/logo.png'">
                <span>Ahmed Nazif</span>
            </a>

            <div class="client-tag">
                <div class="client-dot"></div>
                <span>TEST REVIEW • VORAL</span>
            </div>
        </header>

        <!-- TITLE & SPECS -->
        <div class="title-section">
            <h1 class="title">
                <span class="client-name">Voral</span> — Test Edit
            </h1>
            <div class="specs-line">
                9:16 VERTICAL SHORT • 30 FPS • MASTER RENDER
            </div>
        </div>

        <!-- BESPOKE 9:16 VERTICAL VIDEO PLAYER WITH QUALITY SWITCHER -->
        <div class="custom-player paused" id="player">
            <!-- Top Overlay: Quality Switcher & Mute -->
            <div class="player-top-overlay">
                <div class="quality-wrapper">
                    <button class="quality-toggle-btn" id="qualityToggleBtn" title="Change Video Quality">
                        <div class="quality-dot"></div>
                        <span id="curQualityLabel">1080P Fast</span>
                        <i class="fa-solid fa-chevron-down" style="font-size: 0.55rem; opacity: 0.7;"></i>
                    </button>

                    <!-- Dropdown Quality Menu -->
                    <div class="quality-menu" id="qualityMenu">
                        <button class="quality-option active" data-src="voral-stream.mp4" data-label="1080P Fast">
                            <span>⚡ 1080p Fast Stream</span>
                            <span class="tag">Instant</span>
                        </button>
                        <button class="quality-option" data-src="voral-test.mp4" data-label="Master (67MB)">
                            <span>💎 Master Render</span>
                            <span class="tag">67MB</span>
                        </button>
                    </div>
                </div>

                <button class="sound-indicator" id="muteBtn" title="Toggle Sound">
                    <i class="fa-solid fa-volume-high" id="muteIcon"></i>
                </button>
            </div>

            <!-- Viewport & Video -->
            <div class="video-viewport" id="viewport">
                <video id="mainVideo" playsinline preload="metadata">
                    <!-- Default to fast web-optimized stream -->
                    <source src="voral-stream.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <!-- Center Play/Pause Ripple Button -->
                <div class="play-center-btn" id="centerBtn">
                    <i class="fa-solid fa-play" id="centerIcon"></i>
                </div>
            </div>

            <!-- Floating Custom Bottom Controls -->
            <div class="player-controls" id="controls">
                <!-- Seeker Bar -->
                <div class="seeker-container" id="seeker">
                    <div class="seeker-track">
                        <div class="seeker-buffer" id="bufferBar"></div>
                        <div class="seeker-progress" id="progressBar">
                            <div class="seeker-thumb"></div>
                        </div>
                    </div>
                </div>

                <!-- Buttons & Details -->
                <div class="controls-row">
                    <div class="controls-left">
                        <button class="ctrl-btn" id="playBtn" title="Play/Pause">
                            <i class="fa-solid fa-play" id="playIcon"></i>
                        </button>

                        <div class="time-display">
                            <span class="current" id="curTime">0:00</span> / <span id="durTime">0:00</span>
                        </div>
                    </div>

                    <div class="controls-right">
                        <button class="speed-toggle" id="speedBtn" title="Playback Speed">1.0x</button>
                        
                        <button class="ctrl-btn" id="fsBtn" title="Fullscreen">
                            <i class="fa-solid fa-expand" id="fsIcon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- BIG DOWNLOAD BUTTON (ALWAYS DOWNLOADS MASTER RENDER) -->
        <div class="actions-section">
            <a href="voral-test.mp4" download="Voral_Test_Edit_AhmedNazif.mp4" class="btn-download-master" id="downloadBtn">
                <div class="dl-icon">
                    <i class="fa-solid fa-arrow-down-to-bracket"></i>
                </div>
                <div class="dl-content">
                    <span class="dl-title">Download The Test Video</span>
                    <span class="dl-sub">MP4 • 9:16 Vertical Short • 30 FPS • 67.4 MB Master</span>
                </div>
            </a>

            <div class="sub-actions">
                <button class="btn-ghost" onclick="copyLink()">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Link</span>
                </button>
                <a href="mailto:contact@ahmednazif.com?subject=Feedback%20on%20Voral%20Test" class="btn-ghost">
                    <i class="fa-regular fa-envelope"></i>
                    <span>contact@ahmednazif.com</span>
                </a>
            </div>
        </div>
    </div>

    <!-- MINIMAL FOOTER -->
    <footer class="footer">
        <p>Edited by <a href="https://ahmednazif.com">Ahmed Nazif</a> &bull; Post-Production Studio</p>
    </footer>

    <!-- TOAST -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check" style="color: #34d399;"></i>
        <span id="toastMsg">Link copied to clipboard!</span>
    </div>

    <!-- BESPOKE PLAYER LOGIC -->
    <script>
        const player = document.getElementById('player');
        const video = document.getElementById('mainVideo');
        const viewport = document.getElementById('viewport');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const centerBtn = document.getElementById('centerBtn');
        const centerIcon = document.getElementById('centerIcon');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');
        const speedBtn = document.getElementById('speedBtn');
        const fsBtn = document.getElementById('fsBtn');
        const fsIcon = document.getElementById('fsIcon');
        const seeker = document.getElementById('seeker');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');
        const curTime = document.getElementById('curTime');
        const durTime = document.getElementById('durTime');
        const qualityToggleBtn = document.getElementById('qualityToggleBtn');
        const qualityMenu = document.getElementById('qualityMenu');
        const curQualityLabel = document.getElementById('curQualityLabel');

        let hideTimeout;
        const speeds = [1.0, 1.25, 1.5, 2.0];
        let speedIdx = 0;

        // Toggle Play / Pause
        function togglePlay() {
            if (video.paused || video.ended) {
                video.play();
            } else {
                video.pause();
            }
        }

        viewport.addEventListener('click', (e) => {
            qualityMenu.classList.remove('show');
            centerBtn.classList.remove('pulse-pop');
            void centerBtn.offsetWidth; // trigger reflow
            centerBtn.classList.add('pulse-pop');
            togglePlay();
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });

        video.addEventListener('play', () => {
            player.classList.remove('paused');
            player.classList.add('playing');
            playIcon.className = 'fa-solid fa-pause';
            centerIcon.className = 'fa-solid fa-pause';
            centerBtn.classList.add('is-pause');
            resetHideTimer();
        });

        video.addEventListener('pause', () => {
            player.classList.remove('playing');
            player.classList.add('paused');
            player.classList.remove('hide-controls');
            playIcon.className = 'fa-solid fa-play';
            centerIcon.className = 'fa-solid fa-play';
            centerBtn.classList.remove('is-pause');
            clearTimeout(hideTimeout);
        });

        // Time updates & progress
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            progressBar.style.width = pct + '%';
            curTime.textContent = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            durTime.textContent = formatTime(video.duration);
        });

        video.addEventListener('progress', () => {
            if (video.buffered.length > 0 && video.duration) {
                const bufEnd = video.buffered.end(video.buffered.length - 1);
                bufferBar.style.width = (bufEnd / video.duration) * 100 + '%';
            }
        });

        video.addEventListener('ended', () => {
            player.classList.remove('playing');
            player.classList.add('paused');
            player.classList.remove('hide-controls');
            playIcon.className = 'fa-solid fa-rotate-right';
            centerIcon.className = 'fa-solid fa-rotate-right';
        });

        // Seeker click / drag
        let isSeeking = false;
        seeker.addEventListener('click', seek);
        seeker.addEventListener('mousedown', () => isSeeking = true);
        window.addEventListener('mouseup', () => isSeeking = false);
        window.addEventListener('mousemove', (e) => {
            if (isSeeking) seek(e);
        });

        function seek(e) {
            const rect = seeker.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            progressBar.style.width = (pos * 100) + '%';
            video.currentTime = pos * video.duration;
        }

        // Mute toggle
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.muted = !video.muted;
            updateMuteUI();
        });

        function updateMuteUI() {
            if (video.muted || video.volume === 0) {
                muteIcon.className = 'fa-solid fa-volume-xmark';
                muteBtn.style.color = '#f87171';
            } else {
                muteIcon.className = 'fa-solid fa-volume-high';
                muteBtn.style.color = '#ffffff';
            }
        }

        // Quality Switcher
        qualityToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });

        document.querySelectorAll('.quality-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                const newSrc = opt.getAttribute('data-src');
                const label = opt.getAttribute('data-label');

                if (video.src.endsWith(newSrc)) {
                    qualityMenu.classList.remove('show');
                    return;
                }

                // Preserve playback state
                const currentTime = video.currentTime;
                const isPlaying = !video.paused;

                video.src = newSrc;
                video.currentTime = currentTime;
                if (isPlaying) video.play();

                document.querySelectorAll('.quality-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                curQualityLabel.textContent = label;
                qualityMenu.classList.remove('show');

                showToast(`Switched to ${label}`);
            });
        });

        document.addEventListener('click', (e) => {
            if (!qualityMenu.contains(e.target) && e.target !== qualityToggleBtn) {
                qualityMenu.classList.remove('show');
            }
        });

        // Speed toggle
        speedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            speedIdx = (speedIdx + 1) % speeds.length;
            const newSpeed = speeds[speedIdx];
            video.playbackRate = newSpeed;
            speedBtn.textContent = newSpeed.toFixed(1) + 'x';
        });

        // Fullscreen
        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                if (player.requestFullscreen) player.requestFullscreen();
                else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
                else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
                fsIcon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                fsIcon.className = 'fa-solid fa-expand';
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fsIcon.className = 'fa-solid fa-expand';
            }
        });

        // Auto-hide controls when playing
        function resetHideTimer() {
            clearTimeout(hideTimeout);
            player.classList.remove('hide-controls');
            if (!video.paused && !qualityMenu.classList.contains('show')) {
                hideTimeout = setTimeout(() => {
                    player.classList.add('hide-controls');
                }, 2200);
            }
        }

        player.addEventListener('mousemove', resetHideTimer);
        player.addEventListener('touchstart', resetHideTimer, { passive: true });

        // Helper format time
        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const mins = Math.floor(s / 60);
            const secs = Math.floor(s % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Copy Link
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("Link copied to clipboard!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
